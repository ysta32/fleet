name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - run: npm run typecheck
      - run: npm test -- --passWithNoTests
      - name: Privacy guard (no transcripts / secrets committed)
        run: |
          if git ls-files | grep -E '\.jsonl$' | grep -v '^packages/shared/fixtures/'; then echo "jsonl outside fixtures"; exit 1; fi
          if git ls-files | grep -E '(^|/)\.env'; then echo ".env committed"; exit 1; fi
          if git grep -nE '/Users/[a-z]+/\.claude/projects/' -- ':!*.md' ':!.github/**'; then echo "real transcript path"; exit 1; fi
